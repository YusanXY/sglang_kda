version: 1

# Deployment template only. Replace every /absolute/path/to/... root with a
# reference-owned export directory containing sglang_entry.py before enabling
# a profile. Remove any operator entry that has no exported adapter yet.
# SGLang does not ship candidate implementations.
profiles:
  deepseek_v4_best:
    architecture: DeepseekV4ForCausalLM
    operators:
      # The current exported DeepSeek V4 bundle has Linear, C4 query
      # quantization, and paged-MQA candidates. Add the other supported slots
      # only after their reference directories contain sglang_entry.py.
      deepseek_v4.fp8_gemm_nt:
        operator_id: deepseek_v4_fp8_gemm_nt
        root: /absolute/path/to/deepseek_v4/fp8_gemm_nt
        entrypoint: sglang_entry.py:run
        targets:
          - model.layers.*.self_attn.wqkv_a
          - model.layers.*.self_attn.indexer.wq_b

      deepseek_v4.indexer_fp8_quant:
        operator_id: deepseek_v4_indexer_fp8_quant
        root: /absolute/path/to/deepseek_v4/indexer_fp8_quant
        entrypoint: sglang_entry.py:run

      deepseek_v4.paged_mqa_logits:
        operator_id: deepseek_v4_fp8_paged_mqa_logits
        root: /absolute/path/to/deepseek_v4/paged_mqa_logits
        entrypoint: sglang_entry.py:run

      # Other supported slots:
      # deepseek_v4.topk_transform
      # deepseek_v4.sparse_prefill_attention
      # deepseek_v4.sparse_decode_attention
      # deepseek_v4.dense_swa_attention
      # deepseek_v4.moe

  glm52_best:
    architecture: GlmMoeDsaForCausalLM
    operators:
      glm52.dsa_projection:
        operator_id: glm5_dsa_projection
        root: /absolute/path/to/glm52/dsa_projection
        entrypoint: sglang_entry.py:run
        targets:
          - model.layers.*.self_attn.fused_qkv_a_proj_with_mqa
          - model.layers.*.self_attn.q_b_proj
          - model.layers.*.self_attn.q_proj
          - model.layers.*.self_attn.kv_a_proj_with_mqa
          - model.layers.*.self_attn.kv_b_proj
          - model.layers.*.self_attn.o_proj

      glm52.dsa_indexer:
        operator_id: glm5_dsa_indexer
        root: /absolute/path/to/glm52/dsa_indexer
        entrypoint: sglang_entry.py:run
        targets:
          - model.layers.*.self_attn.indexer.wq_b
          - model.layers.*.self_attn.indexer.wk_weights_proj
          - model.layers.*.self_attn.indexer.wk
          - model.layers.*.self_attn.indexer.weights_proj

      glm52.dsa_index_score:
        operator_id: glm5_dsa_index_score
        root: /absolute/path/to/glm52/dsa_index_score
        entrypoint: sglang_entry.py:run

      glm52.dsa_sparse_attention:
        operator_id: glm5_dsa_unified_sparse_attention
        root: /absolute/path/to/glm52/dsa_sparse_attention
        entrypoint: sglang_entry.py:run

      glm52.moe_masked_grouped_gemm:
        operator_id: glm5_moe_masked_grouped_gemm
        root: /absolute/path/to/glm52/moe_masked_grouped_gemm
        entrypoint: sglang_entry.py:run
